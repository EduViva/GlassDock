<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GlassDock · Comissões</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
  <style>
    main { padding: 110px 0 80px; }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    .sum { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
    @media (max-width: 700px) { .sum { grid-template-columns: repeat(2, 1fr); } }
    .sum div { padding: 16px; border-radius: 16px; background: rgba(255,255,255,.04); border: 1px solid var(--line-soft); }
    .sum b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
    .sum span { color: var(--text-3); font-size: 13px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
    th { color: var(--text-3); font-weight: 600; font-size: 12px; }
    .tbl { overflow-x: auto; border-radius: 18px; border: 1px solid var(--line-soft); background: rgba(255,255,255,.02); }
    .st { padding: 2px 9px; border-radius: 99px; font-size: 12px; background: rgba(255,159,10,.18); color: #ffc46b; white-space: nowrap; }
    .st.paga { background: rgba(48,209,88,.18); color: #7ce99a; }
    .st.cancelada { background: rgba(255,69,58,.18); color: #ff8a80; }
    td .btn { --h: 32px; padding: 0 12px; font-size: 13px; }
    .login { max-width: 420px; margin: 0 auto; padding: 28px; display: flex; flex-direction: column; gap: 14px; }
  </style>
</head>
<body>
<header class="topbar glass">
  <a class="brand" href="/"><img src="/assets/icon.svg" alt="">GlassDock</a>
  <nav class="topnav"><button class="btn btn-ghost btn-sm" id="out" hidden>Sair</button></nav>
</header>
<main class="wrap">
  <form class="glass login" id="login">
    <h2 style="font-size:30px">Comissões</h2>
    <div class="field"><label for="k">Chave de administrador (ADMIN_KEY)</label><input class="input" id="k" type="password" autocomplete="current-password"></div>
    <p class="form-error" id="err"></p>
    <button class="btn btn-primary" type="submit">Entrar</button>
  </form>
  <div id="app" hidden>
    <div class="top"><h2 style="font-size:36px">Comissões</h2><span class="dim" id="auto"></span></div>
    <div class="sum">
      <div><b id="n-ref">0</b><span>indicadores</span></div>
      <div><b id="n-ord">0</b><span>pedidos registrados</span></div>
      <div><b id="n-pend">R$ 0,00</b><span>a pagar</span></div>
      <div><b id="n-paid">R$ 0,00</b><span>pago</span></div>
    </div>
    <div class="tbl"><table>
      <thead><tr><th>Data</th><th>Indicador</th><th>PIX</th><th>Pedido</th><th>Valor</th><th>Status</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </div>
</main>
<div class="toast glass" id="toast" role="status" aria-live="polite"></div>
<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const brl = (c) => (c / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  let key = sessionStorage.getItem('gd_admin') || '';
  const toast = (m) => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3500); };
  const api = (opts = {}) => fetch('/api/admin', { ...opts, headers: { authorization: 'Bearer ' + key, 'content-type': 'application/json' } });

  async function load() {
    const r = await api();
    if (r.status === 401) throw new Error('Chave errada');
    const d = await r.json();
    $('#login').hidden = true; $('#app').hidden = false; $('#out').hidden = false;
    $('#auto').textContent = d.autoPayout ? 'Repasse automático ligado' : 'Repasse manual (AUTO_PAYOUT desligado)';
    $('#n-ref').textContent = d.referrers; $('#n-ord').textContent = d.orders;
    let pend = 0, paid = 0;
    d.items.forEach((i) => { if (i.status === 'paga') paid += i.amount; else if (i.status !== 'cancelada') pend += i.amount; });
    $('#n-pend').textContent = brl(pend); $('#n-paid').textContent = brl(paid);
    $('#rows').innerHTML = d.items.map((i) => {
      const ref = d.refs[i.slug] || {};
      const act = i.status === 'pendente'
        ? `<button class="btn btn-primary" data-a="pay" data-id="${esc(i.id)}">Pagar via PIX</button> <button class="btn btn-ghost" data-a="mark" data-id="${esc(i.id)}">Já paguei</button>`
        : '';
      return `<tr><td>${new Date(i.createdAt).toLocaleString('pt-BR')}</td><td>${esc(ref.name)}<br><span class="dim">/${esc(i.slug)} · ${esc(ref.email)}</span></td><td>${esc(ref.pixType)}<br><span class="dim">${esc(ref.pixKey)}</span></td><td class="dim">${esc(i.ext)}</td><td>${brl(i.amount)}</td><td><span class="st ${esc(i.status)}">${esc(i.status)}</span></td><td style="white-space:nowrap">${act}</td></tr>`;
    }).join('') || '<tr><td colspan="7" class="dim">Nenhuma comissão ainda</td></tr>';
  }

  $('#rows').addEventListener('click', async (e) => {
    const b = e.target.closest('button[data-a]');
    if (!b) return;
    if (b.dataset.a === 'pay' && !confirm('Enviar o PIX desta comissão agora?')) return;
    b.disabled = true;
    const r = await api({ method: 'POST', body: JSON.stringify({ action: b.dataset.a, id: b.dataset.id }) });
    const d = await r.json().catch(() => ({}));
    toast(r.ok ? 'Feito' : 'Erro: ' + (d.error || r.status));
    load();
  });
  $('#login').addEventListener('submit', async (e) => {
    e.preventDefault();
    key = $('#k').value.trim();
    try { await load(); sessionStorage.setItem('gd_admin', key); } catch (ex) { $('#err').textContent = ex.message; }
  });
  $('#out').onclick = () => { sessionStorage.removeItem('gd_admin'); location.reload(); };
  if (key) load().catch(() => sessionStorage.removeItem('gd_admin'));
})();
</script>
</body>
</html>
